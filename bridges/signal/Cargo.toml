[package]
name = "everysaid-signal"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Everysaid's Signal helper: a linked device (presage) speaking JSON lines on stdin/stdout"
publish = false

# presage (whisperfish/presage 33dd1491130793390e356e15a5711f1e6ca14fdb) and libsignal-service-rs
# (whisperfish/libsignal-service-rs 9e6c08b8e6d413391831dc49065e5b05490d6c82) are copied into vendor/
# with our fixes (vendor/README.md); libsignal by the tag they pin (v0.99.0), held by Cargo.lock.
[dependencies]
presage = { path = "vendor/presage" }
presage-store-sqlite = { path = "vendor/presage-store-sqlite" }

base64 = "0.22"
futures = "0.3"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "io-std", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

# As presage's own workspace: its SQLCipher build of libsqlite3-sys.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service" }

[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

[profile.release]
strip = true
