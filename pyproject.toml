[project]
name = "chronika"
version = "0.1.0"
description = "A personal archive of messages and calls from phones and services, with a core, a UI and an MCP server over it"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25",
    "phonenumbers>=9.0.40",
    "platformdirs>=4.12.3",
]

# What the scripts need beyond the archive, by kind of work (`uv run --extra NAME ...`):
[project.optional-dependencies]
# the encrypted iPhone backup: iphone-sync, iphone-ls, iphone-verify, media-restore
iphone = ["iphone-backup-decrypt>=0.11.2"]
# pictures: the review pages, hashing, the vision-model pass
media = ["pillow>=11", "pillow-heif>=0.22", "imagehash>=4.3", "numpy>=2"]
# local models (embeddings, tags, faces), with `torch` (CUDA on Linux, MPS on macOS, else the CPU) or `rocm` (AMD)
ml = ["chronika[media]", "transformers>=4.57", "scipy>=1.13", "insightface>=0.7.3", "onnxruntime>=1.20"]
torch = ["torch>=2.9"]
rocm = ["torch>=2.9; sys_platform == 'linux'", "triton-rocm; sys_platform == 'linux'"]
# Telegram through its API, with the owner's account: telegram-sync
telegram = ["telethon>=1.40"]

[tool.uv]
conflicts = [[{ extra = "torch" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
